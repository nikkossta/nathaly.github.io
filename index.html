<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dein Name | Links</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome für schicke Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glow {
            box-shadow: 0 0 40px -10px rgba(99, 102, 241, 0.3);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Dynamischer Hintergrund-Glow -->
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-1/4 left-1/3 w-80 h-80 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Hauptcontainer -->
    <div class="w-full max-w-md z-10 space-y-6">

        <!-- Profil-Sektion -->
        <div class="text-center space-y-3">
            <div class="relative inline-block">
                <!-- Avatar mit animiertem Rand -->
                <div class="absolute -inset-0.5 bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full blur opacity-75 animate-pulse"></div>
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&auto=format&fit=crop&q=80" 
                     alt="Profilbild" 
                     class="relative w-24 h-24 rounded-full object-cover mx-auto border-2 border-slate-900">
            </div>
            <h1 class="text-xl font-bold tracking-tight">Dein Name / Brand</h1>
            <p class="text-sm text-slate-400 max-w-xs mx-auto">Creator, Developer & Designer 🚀<br>Hier findest du all meine wichtigen Projekte.</p>
        </div>

        <!-- Link-Liste -->
        <div class="space-y-3">

            <!-- Link 1: Haupt-Website -->
            <a href="https://deine-website.de" target="_blank" 
               class="group relative flex items-center justify-between p-4 rounded-xl bg-slate-900/60 border border-slate-800/80 backdrop-blur-md hover:bg-slate-800/80 hover:border-indigo-500/50 transition-all duration-300 transform hover:-translate-y-0.5 shadow-lg">
                <div class="flex items-center space-x-3">
                    <span class="w-10 h-10 rounded-lg bg-indigo-500/10 flex items-center justify-center text-indigo-400 group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-globe"></i>
                    </span>
                    <span class="font-medium text-sm">Meine Haupt-Website</span>
                </div>
                <i class="fa-solid fa-arrow-right text-xs text-slate-500 group-hover:text-indigo-400 group-hover:translate-x-1 transition-all"></i>
            </a>

            <!-- Link 2: GitHub / Portfolio -->
            <a href="https://github.com" target="_blank" 
               class="group relative flex items-center justify-between p-4 rounded-xl bg-slate-900/60 border border-slate-800/80 backdrop-blur-md hover:bg-slate-800/80 hover:border-purple-500/50 transition-all duration-300 transform hover:-translate-y-0.5 shadow-lg">
                <div class="flex items-center space-x-3">
                    <span class="w-10 h-10 rounded-lg bg-purple-500/10 flex items-center justify-center text-purple-400 group-hover:scale-110 transition-transform">
                        <i class="fa-brands fa-github"></i>
                    </span>
                    <span class="font-medium text-sm">GitHub Projekte</span>
                </div>
                <i class="fa-solid fa-arrow-right text-xs text-slate-500 group-hover:text-purple-400 group-hover:translate-x-1 transition-all"></i>
            </a>

            <!-- Link 3: YouTube / Video -->
            <a href="https://youtube.com" target="_blank" 
               class="group relative flex items-center justify-between p-4 rounded-xl bg-slate-900/60 border border-slate-800/80 backdrop-blur-md hover:bg-slate-800/80 hover:border-red-500/50 transition-all duration-300 transform hover:-translate-y-0.5 shadow-lg">
                <div class="flex items-center space-x-3">
                    <span class="w-10 h-10 rounded-lg bg-red-500/10 flex items-center justify-center text-red-400 group-hover:scale-110 transition-transform">
                        <i class="fa-brands fa-youtube"></i>
                    </span>
                    <span class="font-medium text-sm">Neues YouTube Video</span>
                </div>
                <i class="fa-solid fa-arrow-right text-xs text-slate-500 group-hover:text-red-400 group-hover:translate-x-1 transition-all"></i>
            </a>

            <!-- Link 4: Newsletter / Substack -->
            <a href="https://substack.com" target="_blank" 
               class="group relative flex items-center justify-between p-4 rounded-xl bg-slate-900/60 border border-slate-800/80 backdrop-blur-md hover:bg-slate-800/80 hover:border-amber-500/50 transition-all duration-300 transform hover:-translate-y-0.5 shadow-lg">
                <div class="flex items-center space-x-3">
                    <span class="w-10 h-10 rounded-lg bg-amber-500/10 flex items-center justify-center text-amber-400 group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-envelope-open-text"></i>
                    </span>
                    <span class="font-medium text-sm">Wöchentlicher Newsletter</span>
                </div>
                <i class="fa-solid fa-arrow-right text-xs text-slate-500 group-hover:text-amber-400 group-hover:translate-x-1 transition-all"></i>
            </a>

        </div>

        <!-- Social Icons Footer -->
        <div class="flex justify-center space-x-4 pt-4">
            <a href="https://twitter.com" target="_blank" class="w-10 h-10 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-400 hover:text-white hover:border-slate-700 transition-colors">
                <i class="fa-brands fa-twitter"></i>
            </a>
            <a href="https://instagram.com" target="_blank" class="w-10 h-10 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-400 hover:text-white hover:border-slate-700 transition-colors">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="https://linkedin.com" target="_blank" class="w-10 h-10 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-400 hover:text-white hover:border-slate-700 transition-colors">
                <i class="fa-brands fa-linkedin-in"></i>
            </a>
        </div>

        <!-- Footer Branding -->
        <div class="text-center text-xs text-slate-600 pt-2">
            Built with ❤️ & Tailwind
        </div>

    </div>

</body>
</html>
